      potion_healing_major: a large ornate glass bottle of glowing crimson healing potion, wax-sealed with gold filigree
      potion_mana_minor: a small round glass flask of glowing blue mana potion, cork stopper
      potion_mana_major: a large ornate glass bottle of glowing deep blue mana potion, silver filigree and wax seal
      antidote: a slim vial of green antidote liquid with a leaf tied to its neck by string
      smelling_salts: a small open silver box of pale crystalline smelling salts, faint white vapor rising
      remedy_universal: an ornate crystal vial of shimmering golden remedy with a silver cap
      elixir_vigor: a tall flask of thick orange-red elixir with a bull emblem on its label-less glass
      elixir_intelligence: a tall elegant flask of violet elixir with swirling sparkles inside
      elixir_dexterity: a slim tall flask of bright yellow-green elixir with a feather tied to it
      blinding_bomb: a round glass bomb filled with glowing white powder, short fuse, bright flash sparkling inside
      smoke_bomb: a round clay smoke bomb with a short fuse, wisps of grey smoke
      explosive_vial: a glass vial of bubbling orange alchemical liquid with a lit fuse, sparks
      torch: a wooden torch wrapped in oiled cloth, burning with a warm flame
      rope: a neat round coil of thick hemp rope lying flat, seen from above at an angle, with an iron grappling hook beside it
      lockpick: a small leather roll of thief's lockpicks and picks
      teleport_stone: a smooth polished stone engraved with a glowing teal teleportation rune
      compass_enchanted: an enchanted brass compass with a glowing blue needle and arcane symbols
      protective_talisman: a protective talisman amulet of silver with a blue gem on a leather cord
      knowledge_scroll: a rolled parchment scroll of ancient knowledge tied with a red ribbon, faint golden runes glowing on the visible edge
