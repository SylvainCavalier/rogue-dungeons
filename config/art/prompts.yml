      ancient_relic: an ancient ornate golden reliquary casket encrusted with gems and strange glyphs, faint magical glow seeping from its lid
      incomplete_map: an unrolled old parchment treasure map with ink drawings of mountains, paths and a tower, one corner torn off and burned edges

  # The Fortress page overlays gate positions on this map (GATES in
  # app/frontend/components/game/FortressMap.vue). If you regenerate it,
  # re-check those coordinates.
  maps:
    dir: fortress
    style: map
    model: fal-ai/flux-pro/v1.1
    size: square_hd
    output_width: 1280
    items:
      town_map: >-
        Top-down orthographic view straight from above of a dense medieval walled town at dusk,
        painted fantasy map style. A square stone curtain wall with four corner towers encloses
        the town. The wall has exactly four gatehouses, one in the middle of each side: north,
        south, east and west. Two straight cobblestone main streets cross the town forming a
        plus sign, connecting opposite gates and meeting at a central market square with a
        fountain. The four quarters between the streets are densely packed with timber houses
        with slate and red tile roofs, glowing windows, small gardens. Outside the walls: a dirt
        road leaves each gate, muddy fields and dark forest

# Removed from the game: prompts kept for reference, images in config/art/archive/items/.
# Not read by art:generate (outside `groups`).
archived:
  items:
    soul_fragment: a floating shard of ghostly pale blue soul energy, ethereal wisps
    club_primitive: a primitive wooden club studded with rough stones and bone shards, shown diagonally from bottom-left to top-right filling the frame
    hammer_arms: a massive steel war hammer with a square head and a long iron-banded handle, shown diagonally from bottom-left to top-right filling the frame
    sling: a simple leather sling with a smooth stone in its pouch, shown diagonally from bottom-left to top-right filling the frame
    bow_composite: a recurve composite bow of horn and wood with bone tips and decorated grip, shown diagonally from bottom-left to top-right filling the frame
    bow_runic: a runic bow with glowing blue runes carved along its limbs, silver string, shown diagonally from bottom-left to top-right filling the frame
    helm_steel: a closed steel great helm with narrow eye slits
    boots_soldier: a pair of sturdy soldier boots with steel greaves
