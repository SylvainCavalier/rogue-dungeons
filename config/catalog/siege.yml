# Récompenses d'une victoire : part (%) de la valeur XP / or des assaillants.
# Volontairement faible : la tour reste le moyen de progresser, le siège sert à protéger la ville.
rewards:
  xp_percent: 20
  gold_percent: 20

# Croissance des vagues avec les semaines (semaine N = N-ième semaine de jeu).
# Taille de la vague = base_size + (semaine - 1) / extra_enemy_every_weeks, plafonnée à max_enemies ;
# les ennemis "core" de la vague sont toujours présents, le reste est complété avec "fill".
# Au-delà de la semaine hp_scaling_from_week : +hp_percent_per_week % PV par semaine.
# Toutes les stat_bonus_every_weeks semaines : +1 bonus en attaque et en dégâts (3 bonus = +1D).
wave_scaling:
  base_size: 2
  extra_enemy_every_weeks: 3
  max_enemies: 8
  hp_scaling_from_week: 4
  hp_percent_per_week: 5
  stat_bonus_every_weeks: 8

# Vagues de siège par semaine totale écoulée : core = toujours présents, fill = renforts
waves:
  - week_range: [1, 2]
    enemies:
      - { key: "gobelin_eclaireur", count: 2 }
    fill: "gobelin_eclaireur"

  - week_range: [3, 4]
    enemies:
      - { key: "gobelin_eclaireur", count: 1 }
      - { key: "bandit_pillard", count: 1 }
    fill: "gobelin_eclaireur"

  - week_range: [5, 8]
    enemies:
      - { key: "bandit_pillard", count: 1 }
      - { key: "loup_enrage", count: 1 }
    fill: "bandit_pillard"

  - week_range: [9, 12]
    enemies:
      - { key: "loup_enrage", count: 1 }
      - { key: "orc_guerrier", count: 1 }
    fill: "loup_enrage"

  - week_range: [13, 16]
    enemies:
      - { key: "orc_guerrier", count: 1 }
      - { key: "troll_assiegeant", count: 1 }
    fill: "orc_guerrier"

  - week_range: [17, 24]
    enemies:
      - { key: "troll_assiegeant", count: 1 }
      - { key: "chef_orc", count: 1 }
    fill: "orc_guerrier"

  - week_range: [25, 36]
    enemies:
      - { key: "chef_orc", count: 1 }
      - { key: "golem_siege", count: 1 }
    fill: "troll_assiegeant"

  - week_range: [37, 999]
    enemies:
      - { key: "golem_siege", count: 1 }
      - { key: "dragon_mineur", count: 1 }
    fill: "chef_orc"

