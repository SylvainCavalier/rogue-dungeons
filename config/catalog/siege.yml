# Vagues de siège par semaine totale écoulée
waves:
  - week_range: [1, 2]
    enemies:
      - { key: "gobelin_eclaireur", count: 2 }

  - week_range: [3, 4]
    enemies:
      - { key: "gobelin_eclaireur", count: 2 }
      - { key: "bandit_pillard", count: 1 }

  - week_range: [5, 8]
    enemies:
      - { key: "bandit_pillard", count: 2 }
      - { key: "loup_enrage", count: 1 }

  - week_range: [9, 12]
    enemies:
      - { key: "loup_enrage", count: 2 }
      - { key: "orc_guerrier", count: 1 }

  - week_range: [13, 16]
    enemies:
      - { key: "orc_guerrier", count: 2 }
      - { key: "troll_assiegeant", count: 1 }

  - week_range: [17, 24]
    enemies:
      - { key: "orc_guerrier", count: 2 }
      - { key: "troll_assiegeant", count: 1 }
      - { key: "chef_orc", count: 1 }

  - week_range: [25, 36]
    enemies:
      - { key: "troll_assiegeant", count: 2 }
      - { key: "chef_orc", count: 1 }
      - { key: "golem_siege", count: 1 }

  - week_range: [37, 999]
    enemies:
      - { key: "chef_orc", count: 2 }
      - { key: "golem_siege", count: 1 }
      - { key: "dragon_mineur", count: 1 }

