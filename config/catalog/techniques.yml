# Mechanics of the techniques listed in techniques.md (same keys).
# `cooldown`: rounds during which the technique can't be used again (0 = always available).
# `requires`: key of a technique that must be learned first (advanced techniques).
# `guild_rank`: warriors guild rank needed to learn it (default apprenti, see guildes.yml).
# Passive techniques (category "passive") have no action: their `passive` key is read by CombatService.
# Entries absent from techniques.md are monster-only abilities (see monstres.yml).
techniques:
  # === Offensives ===
  coup_rapide:
    name: "Coup rapide"
    category: "offensive"
    type: "attack_modifier"
    accuracy_bonus: 2
    damage_bonus: -1
    cooldown: 0
    description: "Attaque plus précise (+2) mais moins puissante (-1)."

  coup_charge:
    name: "Coup chargé"
    category: "offensive"
    type: "attack_modifier"
    accuracy_bonus: -1
    damage_mastery_mod: 1
    damage_bonus: 1
    cooldown: 2
    description: "Attaque lourde : -1 précision, +1D+1 dégâts."

  double_entaille:
    name: "Double entaille"
    category: "offensive"
    type: "multi_attack"
    hits: 2
    accuracy_mastery_mod: -1
    damage_mastery_mod: 0
    cooldown: 2
    description: "Deux frappes sur la même cible, -1D de précision chacune."

  estoc_perforant:
    name: "Estoc perforant"
    category: "offensive"
    type: "armor_pierce"
    dr_reduction_percent: 50
    cooldown: 2
    description: "Ignore la moitié de la résistance de la cible."

  frappe_circulaire:
    name: "Frappe circulaire"
    guild_rank: "compagnon"
    category: "offensive"
    type: "aoe"
    accuracy_mastery_mod: -1
    damage_mastery_mod: 0
    cooldown: 3
    description: "Touche tous les ennemis, -1D de précision."

  execution:
    name: "Exécution"
    guild_rank: "compagnon"
    category: "offensive"
    type: "execute"
    hp_threshold: 30
    damage_multiplier: 2
    accuracy_bonus: -1
    cooldown: 3
    description: "Dégâts doublés si la cible a moins de 30% de ses PV."

  # === Défensives ===
  posture_defensive:
    name: "Posture défensive"
    category: "defensive"
    type: "stance"
    defense_mastery: 2
    cooldown: 2
    description: "+2D en esquive ou en parade jusqu'à votre prochaine action."

  mur_d_acier:
    name: "Mur d'acier"
    category: "defensive"
    type: "stance"
    dr_mastery: 2
    cooldown: 3
    description: "+2D de résistance aux dégâts jusqu'à votre prochaine action."

  contre_attaque:
    name: "Contre-attaque"
    guild_rank: "compagnon"
    category: "defensive"
    type: "counter"
    cooldown: 3
    description: "Riposte à chaque attaque ennemie esquivée ou parée jusqu'à votre prochaine action."

  resilience:
    name: "Résilience"
    guild_rank: "compagnon"
    category: "defensive"
    type: "heal"
    heal_mastery: 2
    heal_bonus: 2
    cooldown: 4
    description: "Récupère 2D+2 PV."

  # === Techniques à effet ===
  saignee:
    name: "Saignée"
    category: "effect"
    type: "status_attack"
    inflict_status: "Saignement"
    status_duration: 3
    cooldown: 2
    description: "Inflige Saignement (1D dégâts/tour, 3 tours)."

  brise_garde:
    name: "Brise-garde"
    category: "effect"
    type: "status_attack"
    inflict_status: "Garde brisée"
    status_duration: 3
    cooldown: 3
    description: "Garde brisée : -1D d'esquive à la cible pendant 3 tours."

  desarmement:
    name: "Désarmement"
    category: "effect"
    type: "status_attack"
    accuracy_bonus: 1
    damage_bonus: -2
    inflict_status: "Désarmé"
    status_duration: 3
    cooldown: 3
    description: "Désarmé : -1D d'attaque à la cible pendant 3 tours."

  fracture:
    name: "Fracture"
    guild_rank: "compagnon"
    category: "effect"
    type: "status_attack"
    damage_bonus: 1
    inflict_status: "Affaibli"
    status_duration: 3
    cooldown: 3
    description: "Affaibli : -1D de dégâts à la cible pendant 3 tours."

  provocation:
    name: "Provocation"
    guild_rank: "compagnon"
    category: "effect"
    type: "status_attack"
    accuracy_bonus: 1
    inflict_status: "Enragé"
    status_duration: 3
    cooldown: 3
    description: "Enrage la cible : +1D de dégâts pour elle, mais -1D d'esquive. Un pari risqué."

  intimidation_martiale:
    name: "Intimidation martiale"
    guild_rank: "compagnon"
    category: "effect"
    type: "status_attack"
    inflict_status: "Terrorisé"
    status_duration: 2
    cooldown: 3
    description: "Terrorise la cible (-1D à tout pendant 2 tours)."

  etourdissement:
    name: "Étourdissement"
    guild_rank: "compagnon"
    category: "effect"
    type: "status_attack"
    accuracy_bonus: -1
    damage_bonus: 1
    inflict_status: "Étourdi"
    status_duration: 1
    cooldown: 4
    description: "Étourdit la cible si le coup porte bien (elle perd son tour)."

  # === Techniques avancées ===
  jugement_du_guerrier:
    name: "Jugement du guerrier"
    guild_rank: "maitre"
    category: "advanced"
    type: "execute"
    hp_threshold: 50
    damage_multiplier: 2
    accuracy_bonus: 1
    requires: "execution"
    cooldown: 4
    description: "Dégâts doublés si la cible a moins de 50% de ses PV, +1 précision."

  rafale_implacable:
    name: "Rafale implacable"
    guild_rank: "maitre"
    category: "advanced"
    type: "multi_attack"
    hits: 4
    accuracy_mastery_mod: -1
    damage_mastery_mod: 0
    requires: "double_entaille"
    cooldown: 5
    description: "Quatre frappes sur la même cible, -1D de précision chacune."

  deluge_de_lames:
    name: "Déluge de lames"
    guild_rank: "maitre"
    category: "advanced"
    type: "aoe"
    accuracy_mastery_mod: 0
    damage_mastery_mod: 1
    damage_bonus: 2
    requires: "frappe_circulaire"
    cooldown: 5
    description: "Touche tous les ennemis avec +1D+2 dégâts."

  frappe_transcendante:
    name: "Frappe transcendante"
    guild_rank: "maitre"
    category: "advanced"
    type: "attack_modifier"
    auto_hit: true
    damage_mastery_mod: 1
    damage_bonus: 2
    requires: "coup_charge"
    cooldown: 5
    description: "Touche à coup sûr, +1D+2 dégâts."

  # === Techniques passives ===
  rage_du_desespoir:
    name: "Rage du désespoir"
    category: "passive"
    type: "passive"
    passive: "desperate_rage"
    hp_threshold: 30
    description: "Passif : +1D aux dégâts de vos armes sous 30% de vos PV."

  instinct_du_veteran:
    name: "Instinct du vétéran"
    guild_rank: "compagnon"
    category: "passive"
    type: "passive"
    passive: "veteran_instinct"
    description: "Passif : le malus d'esquive/parade face à plusieurs attaquants ne commence qu'à la 3e attaque du tour."

  riposte:
    name: "Riposte"
    guild_rank: "compagnon"
    category: "passive"
    type: "passive"
    passive: "riposte"
    description: "Passif : en parade, contre-attaque automatiquement la première attaque parée de chaque tour."

  survie:
    name: "Survie"
    guild_rank: "maitre"
    category: "passive"
    type: "passive"
    passive: "survival"
    description: "Passif : une fois par combat, un coup qui devrait vous tuer vous laisse à 1 PV."

  # === Monster-only abilities ===
  charge_ecrasante:
    name: "Charge écrasante"
    category: "effect"
    type: "attack_modifier"
    accuracy_bonus: -2
    damage_bonus: 4
    inflict_status: "Étourdi"
    status_duration: 1
    status_chance: 50
    description: "Charge puissante, chance d'étourdir."
