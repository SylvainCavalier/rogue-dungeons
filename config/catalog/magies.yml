    description: "Petite flamme infligeant 1D+2 dégâts."

  boule_de_feu:
    name: "Boule de feu"
    element: "feu"
    tier: 2
    mana_cost: 4
    type: "damage_status"
    damage_mastery: 2
    damage_bonus: 1
    inflict_status: "Brûlé"
    status_chance: 40
    status_duration: 2
    description: "2D+1 dégâts, 40% de chance de brûler."

  mur_de_flammes:
    name: "Mur de flammes"
    element: "feu"
    tier: 3
    mana_cost: 6
    type: "damage_aoe"
    damage_mastery: 2
    damage_bonus: 0
    inflict_status: "Brûlé"
    status_chance: 30
    status_duration: 2
    description: "2D dégâts à tous les ennemis, chance de brûler."

  explosion_ardente:
    name: "Explosion ardente"
    element: "feu"
    tier: 4
    mana_cost: 8
    type: "damage"
    damage_mastery: 3
    damage_bonus: 2
    inflict_status: "Brûlé"
    status_chance: 60
    status_duration: 2
    description: "3D+2 dégâts, forte chance de brûler."

  meteore_mineur:
    name: "Météore mineur"
    element: "feu"
    tier: 5
    mana_cost: 10
    type: "damage_aoe"
    damage_mastery: 3
    damage_bonus: 1
    inflict_status: "Brûlé"
    status_chance: 50
    status_duration: 3
    description: "3D+1 dégâts à tous, brûle souvent."

  brasier_purificateur:
    name: "Brasier purificateur"
    element: "feu"
    tier: 6
    mana_cost: 13
    type: "damage"
    damage_mastery: 4
    damage_bonus: 2
    inflict_status: "Brûlé"
    status_chance: 80
    status_duration: 3
    description: "4D+2 dégâts dévastateurs."

  incineration:
    name: "Incinération"
    element: "feu"
    tier: 7
    mana_cost: 16
    type: "damage_aoe"
    damage_mastery: 5
    damage_bonus: 0
    inflict_status: "Brûlé"
    status_chance: 100
    status_duration: 3
    description: "5D dégâts à tous, brûle toujours."

  # === EAU ===
  jet_d_eau:
    name: "Jet d'eau"
    element: "eau"
    tier: 1
    mana_cost: 2
    type: "damage"
    damage_mastery: 1
    damage_bonus: 1
    description: "1D+1 dégâts d'eau."

  lame_aqueuse:
    name: "Lame aqueuse"
    element: "eau"
    tier: 2
    mana_cost: 4
    type: "damage"
    damage_mastery: 2
    damage_bonus: 2
    description: "2D+2 dégâts tranchants d'eau."

  prison_liquide:
    name: "Prison liquide"
    element: "eau"
    tier: 3
    mana_cost: 5
    type: "status"
    inflict_status: "Gelé"
    status_duration: 2
    damage_mastery: 1
    damage_bonus: 0
    description: "1D dégâts et gèle l'ennemi si le sort touche bien."

  pluie_regenerante:
    name: "Pluie régénérante"
    element: "eau"
    tier: 4
    mana_cost: 7
    type: "heal"
    heal_mastery: 2
    heal_bonus: 3
    description: "Soigne 2D+3 PV."

  vague_ecrasante:
    name: "Vague écrasante"
    element: "eau"
    tier: 5
    mana_cost: 10
    type: "damage_aoe"
    damage_mastery: 3
    damage_bonus: 0
    inflict_status: "Gelé"
    status_chance: 40
    status_duration: 2
    description: "3D dégâts à tous, chance de geler."

  maree_protectrice:
    name: "Marée protectrice"
    element: "eau"
    tier: 6
    mana_cost: 11
    type: "buff"
    buff_statuses: ["Protégé", "Régénération"]
    buff_duration: 3
    description: "Protégé et Régénération (1D PV/tour) pendant 3 tours."

  deluge_abyssal:
    name: "Déluge abyssal"
    element: "eau"
    tier: 7
    mana_cost: 15
    type: "damage_aoe"
    damage_mastery: 4
    damage_bonus: 2
    inflict_status: "Gelé"
    status_chance: 60
    status_duration: 2
    description: "4D+2 dégâts à tous, gèle souvent."

  # === OMBRE ===
  trait_obscur:
    name: "Trait obscur"
    element: "ombre"
    tier: 1
    mana_cost: 2
    type: "damage"
    damage_mastery: 1
    damage_bonus: 2
    description: "1D+2 dégâts d'ombre."

  cecite:
    name: "Cécité"
    element: "ombre"
    tier: 2
    mana_cost: 4
    type: "status"
    inflict_status: "Aveuglé"
    status_duration: 2
    damage_mastery: 0
    damage_bonus: 0
    description: "Aveugle l'ennemi s'il est bien touché (-2D en précision, 2 tours)."

  drain_vital:
    name: "Drain vital"
    element: "ombre"
    tier: 3
    mana_cost: 5
    type: "drain"
    damage_mastery: 2
    damage_bonus: 0
    drain_percent: 50
    description: "2D dégâts, soigne le lanceur de 50% des dégâts."

  pas_dans_l_ombre:
    name: "Pas dans l'ombre"
    element: "ombre"
    tier: 4
    mana_cost: 6
    type: "buff"
    buff_status: "Invisible"
    buff_duration: 1
    description: "Invisible : votre prochaine attaque ou votre prochain sort touche à coup sûr."

  malediction:
    name: "Malédiction"
    element: "ombre"
    tier: 5
    mana_cost: 8
    type: "status"
    inflict_status: "Maudit"
    status_duration: 3
    damage_mastery: 1
    damage_bonus: 0
    description: "1D dégâts et Maudit 3 tours : ses résistances baissent de 25% (vulnérable)."

  necromancie:
    name: "Nécromancie"
    element: "ombre"
    tier: 6
    mana_cost: 12
    type: "raise_dead"
    taunt: 50
    description: "Relève le plus puissant ennemi tombé (hors boss) pour qu'il combatte à vos côtés. Jet d'Ombre : plus il est réussi, plus le mort-vivant est fort."

  # Monster-only since Nécromancie took its place at the academy (see monstres.yml).
  terreur_nocturne:
    name: "Terreur nocturne"
    element: "ombre"
    tier: 6
    mana_cost: 10
    type: "damage_status"
    damage_mastery: 3
    damage_bonus: 1
    inflict_status: "Terrorisé"
    status_chance: 70
    status_duration: 2
    description: "3D+1 dégâts, terrifie souvent."

  eclipse:
    name: "Éclipse"
    element: "ombre"
    tier: 7
    mana_cost: 15
    type: "damage_aoe"
    damage_mastery: 4
    damage_bonus: 1
    inflict_status: "Aveuglé"
    status_chance: 80
    status_duration: 2
    description: "4D+1 dégâts à tous, aveugle presque toujours."

  # === LUMIÈRE ===
  rayon_sacre:
    name: "Rayon sacré"
    element: "lumiere"
    tier: 1
    mana_cost: 2
    type: "damage"
    damage_mastery: 1
    damage_bonus: 2
    description: "1D+2 dégâts de lumière."

  soin_leger:
    name: "Soin léger"
    element: "lumiere"
    tier: 2
    mana_cost: 3
    type: "heal"
    heal_mastery: 1
    heal_bonus: 2
    description: "Soigne 1D+2 PV."

  dissipation:
    name: "Dissipation"
    element: "lumiere"
    tier: 3
    mana_cost: 4
    type: "cure"
    description: "Retire tous les statuts négatifs."

  bouclier_lumineux:
    name: "Bouclier lumineux"
    element: "lumiere"
    tier: 4
    mana_cost: 6
    type: "buff"
    buff_statuses: ["Protégé", "Béni"]
    buff_duration: 3
    description: "Protégé (+1D résistance) et Béni (+1 à tous les jets) pendant 3 tours."

  purification:
    name: "Purification"
    element: "lumiere"
    tier: 5
    mana_cost: 8
    type: "heal_cure"
    heal_mastery: 2
    heal_bonus: 4
    description: "Soigne 2D+4 PV et retire les statuts négatifs."

  lumiere_vitale:
    name: "Lumière vitale"
    element: "lumiere"
    tier: 6
    mana_cost: 12
    type: "heal"
    heal_percent: 50
    description: "Rend la moitié de vos PV maximum."

  jugement_celeste:
    name: "Jugement céleste"
    element: "lumiere"
    tier: 7
    mana_cost: 15
    type: "damage_aoe"
    damage_mastery: 4
    damage_bonus: 2
    description: "4D+2 dégâts de lumière à tous les ennemis."

  # === NATURE ===
  racines_entravantes:
    name: "Racines entravantes"
    element: "nature"
    tier: 1
    mana_cost: 2
    type: "status"
    inflict_status: "Paralysé"
    status_duration: 1
    damage_mastery: 0
    damage_bonus: 0
    description: "Paralyse l'ennemi s'il est bien touché (50% de perdre son prochain tour)."

  ecorce_protectrice:
    name: "Écorce protectrice"
    element: "nature"
    tier: 2
    mana_cost: 3
    type: "buff"
    buff_status: "Protégé"
    buff_duration: 2
    description: "Protégé (+1D résistance) pendant 2 tours."

  spores_toxiques:
    name: "Spores toxiques"
    element: "nature"
    tier: 3
    mana_cost: 5
    type: "damage_status"
    damage_mastery: 1
    damage_bonus: 1
    inflict_status: "Empoisonné"
    status_chance: 70
    status_duration: 3
    description: "1D+1 dégâts, empoisonne souvent."

  appel_des_betes:
    name: "Appel des bêtes"
    element: "nature"
    tier: 4
    mana_cost: 7
    type: "damage_aoe"
    damage_mastery: 2
    damage_bonus: 1
    description: "La meute se jette sur tous les ennemis : 2D+1 dégâts à chacun."

  croissance_acceleree:
    name: "Croissance accélérée"
    element: "nature"
    tier: 5
    mana_cost: 8
    type: "buff"
    buff_status: "Régénération"
    buff_duration: 3
    description: "Régénération (1D PV/tour) pendant 3 tours."

  regeneration_sauvage:
    name: "Régénération sauvage"
    element: "nature"
    tier: 6
    mana_cost: 10
    type: "heal"
    heal_mastery: 3
    heal_bonus: 3
    description: "Soigne 3D+3 PV."

  courroux_sylvestre:
    name: "Courroux sylvestre"
    element: "nature"
    tier: 7
    mana_cost: 14
    type: "damage_aoe"
    damage_mastery: 4
    damage_bonus: 1
    inflict_status: "Empoisonné"
    status_chance: 60
    status_duration: 3
    description: "4D+1 dégâts à tous, empoisonne souvent."

  # === INVOCATION ===
  # `summon`: creature key in invocations.yml. No accuracy roll: the Invocation
  # skill sets the creature's strength. One creature at a time (a new one replaces it).
  familier:
    name: "Familier"
    element: "invocation"
    tier: 1
    mana_cost: 3
    type: "summon"
    summon: "familier"
    description: "Un petit familier griffe vos ennemis et détourne une partie de leurs coups (30%)."

  loup_spectral:
    name: "Loup spectral"
    element: "invocation"
    tier: 2
    mana_cost: 5
    type: "summon"
    summon: "loup_spectral"
    description: "Un loup spectral, vif et mordant, combat à vos côtés."

  golem_d_argile:
    name: "Golem d'argile"
    element: "invocation"
    tier: 3
    mana_cost: 7
    type: "summon"
    summon: "golem_d_argile"
    description: "Un golem robuste qui attire la plupart des coups ennemis (70%)."

  esprit_gardien:
    name: "Esprit gardien"
    element: "invocation"
    tier: 4
    mana_cost: 8
    type: "summon"
    summon: "esprit_gardien"
    description: "Un esprit bienveillant qui vous soigne (1D+2 PV) à chaque tour. Il n'attaque pas."

  elementaire_de_feu:
    name: "Élémentaire de feu"
    element: "invocation"
    tier: 5
    mana_cost: 10
    type: "summon"
    summon: "elementaire_de_feu"
    description: "Un élémentaire de flammes : dégâts de feu, peut brûler."

  gardien_de_pierre:
    name: "Gardien de pierre"
    element: "invocation"
    tier: 6
    mana_cost: 12
    type: "summon"
    summon: "gardien_de_pierre"
    description: "Un colosse de pierre presque indestructible qui encaisse les coups à votre place (80%)."

  phenix:
    name: "Phénix"
    element: "invocation"
    tier: 7
    mana_cost: 15
    type: "summon"
    summon: "phenix"
    description: "Un phénix embrase tous les ennemis à chaque tour et renaît une fois de ses cendres."
